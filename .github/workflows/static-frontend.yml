name: Static frontend preview
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/static-frontend.yml']
permissions:
  contents: read
jobs:
  verify-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:static
        env:
          NEXT_PUBLIC_API_URL: https://ecommerce-platform-api-2kh1.onrender.com
      - run: npx playwright install --with-deps chromium
      - run: npm run test:static
