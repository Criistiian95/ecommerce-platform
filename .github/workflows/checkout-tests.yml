name: Checkout and stock
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/checkout-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/checkout-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-test-only
          MYSQL_DATABASE: ecommerce_test_checkout
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm test --prefix backend
      - run: npm run test:mysql --prefix backend
        env:
          TEST_DATABASE_URL: mysql://root:local-test-only@127.0.0.1:3306/ecommerce_test_checkout
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
